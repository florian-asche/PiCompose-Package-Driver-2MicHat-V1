# Output path of the ReSpeaker 2-Mics Pi HAT (WM8960).
# The codec starts with Headphone at 0 (-121 dB), which is nearly silent, and the standard path of
# PipeWire does not control it. Headphone (3.5 mm jack) and Speaker are merged into the volume of the
# sink. The digital volume Playback is set to 0 dB.

[General]
priority = 99
description-key = analog-output

[Element Headphone]
switch = off
volume = merge
override-map.1 = all
override-map.2 = all-left,all-right

[Element Speaker]
switch = off
volume = merge
override-map.1 = all
override-map.2 = all-left,all-right

[Element Playback]
switch = off
volume = zero
